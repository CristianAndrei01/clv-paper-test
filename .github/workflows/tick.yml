name: tick

# 60 de rulări pe zi, între 14:00 și 05:00 UTC (09:00–00:00 ora SUA de Est).
# De la 14:00 ca predictorul să prindă și meciurile de weekend de la 17:00 UTC (2–3 ore înainte).
# Minute „ciudate” (:07, :22, :37, :52): rulările programate fix la :00 sunt cele mai întârziate de GitHub.
# Fiecare tick decide singur, din baza de date, ce e scadent: snapshot-uri și, o dată pe zi, predictorul.
on:
  schedule:
    - cron: "7,22,37,52 14-23 * * *"
    - cron: "7,22,37,52 0-4 * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # o rulare cu predictor (căutare web) poate dura 5–15 minute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Colector și predictor
        run: python -m clvtest tick
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          DB_URL_COLLECTOR: ${{ secrets.DB_URL_COLLECTOR }}
          DB_URL_PREDICTOR: ${{ secrets.DB_URL_PREDICTOR }}
          # Predictorul rulează doar dacă secretul ANTHROPIC_API_KEY există.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACTIVE_SPORTS: basketball_nba
          PREDICTOR_MODEL: claude-opus-5-5
          PREDICTOR_EFFORT: high
          EDGE_THRESHOLD: "0.03"
          PREDICTOR_MAX_SEARCHES: "30"
